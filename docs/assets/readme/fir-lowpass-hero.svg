  </g>
  <g transform="translate(70 82)" fill="none" stroke="url(#accent)" stroke-width="6" filter="url(#glow)">
    <path d="M0 98 C26 20 52 176 78 98 S130 20 156 98 S208 176 234 98 S286 20 312 98"/>
    <path d="M0 206 C52 206 58 144 104 144 H176 C222 144 228 206 312 206" opacity="0.8"/>
  </g>
