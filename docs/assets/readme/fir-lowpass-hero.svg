    <g fill="#1e3a5f" stroke="#7dd3fc" stroke-width="2">
      <rect x="22" y="62" width="50" height="52" rx="8"/>
      <rect x="86" y="62" width="50" height="52" rx="8"/>
      <rect x="150" y="62" width="50" height="52" rx="8"/>
    </g>
    <path d="M0 88H22M72 88H86M136 88H150M200 88H238" stroke="#34d399" stroke-width="5"/>
    <path d="M238 68L260 88L238 108Z" fill="#34d399"/>
    <text x="130" y="34" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">261-TAP PIPELINE</text>
    <text x="130" y="148" fill="#93c5fd" font-family="Consolas,monospace" font-size="15" text-anchor="middle">Q1.15 · BIT-TRUE · 459.348 MS/s</text>
  </g>
  <g transform="translate(870 86)">
    <rect width="240" height="244" rx="24" fill="#08151d" stroke="#34d399" stroke-width="3"/>
    <rect x="34" y="40" width="172" height="158" rx="12" fill="#0f513c" stroke="#86efac" stroke-width="2"/>
    <g fill="#bbf7d0">
      <rect x="55" y="62" width="32" height="32" rx="4"/><rect x="104" y="62" width="32" height="32" rx="4"/><rect x="153" y="62" width="32" height="32" rx="4"/>
      <rect x="55" y="112" width="32" height="32" rx="4"/><rect x="104" y="112" width="32" height="32" rx="4"/><rect x="153" y="112" width="32" height="32" rx="4"/>
    </g>
    <g stroke="#4ade80" stroke-width="3"><path d="M0 84H34M206 84H240M0 126H34M206 126H240M0 168H34M206 168H240"/></g>
    <text x="120" y="226" fill="#d1fae5" font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">XCZU4EV · 16/16 PASS</text>
